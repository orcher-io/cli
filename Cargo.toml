[package]
name = "orcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "The ORCHER command-line interface: run an engine, start and inspect workflows, on your machine or in ORCHER Cloud"
repository = "https://github.com/orcher-io/cli"
homepage = "https://github.com/orcher-io"
readme = "README.md"
keywords = ["orcher", "workflow", "durable-execution", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "orcher_cli"
path = "src/lib.rs"

[[bin]]
name = "orcher"
path = "src/main.rs"

[dependencies]
orcher-proto = "0.1"

# gRPC. `tls-native-roots` verifies https:// servers against the operating
# system's trust store; http:// servers stay plaintext.
tonic = { version = "0.12", features = ["tls-native-roots"] }
prost-types = "0.13"

tokio = { version = "1", features = ["full"] }
futures = "0.3"

clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

# HTTP, for an ORCHER Cloud gateway: login, batch operations, log streaming.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
reqwest-eventsource = "0.6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Table formatting; `ansi` so that column widths ignore color escapes.
tabled = { version = "0.15", features = ["ansi"] }

anyhow = "1"
thiserror = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

uuid = { version = "1.6", features = ["v4", "serde"] }
jiff = { version = "0.2", features = ["serde"] }
url = "2.4"
regex = "1"
base64 = "0.22"
convert_case = "0.6"
cron = "0.12"

dirs = "5"
handlebars = "4"
dialoguer = "0.11"
indicatif = "0.17"
console = "0.15"
open = "5"
keyring = "2.3"
tempfile = "3.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.9"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = "3.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = ["Win32_Security_Credentials"] }

[profile.release]
strip = true
lto = "thin"

# The profile dist builds release binaries with.
[profile.dist]
inherits = "release"

[dev-dependencies]
# A stand-in HTTP server, for the commands only a cloud gateway serves.
mockito = "1"
