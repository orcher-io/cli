name: CI

# Runs on GitHub-hosted runners only. Pull requests from forks run here too,
# so this workflow must never target a self-hosted runner or read secrets.

on:
  pull_request:
  push:
    branches: [main]
  # For pull requests opened by a workflow (the engine version bump), whose
  # pull_request events start nothing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Single-threaded: a few tests change process environment variables.
      - run: cargo test --lib --locked -- --test-threads=1

  # Every command, against the published engine image: the CLI starts the
  # engine itself with `orcher dev start`, a Python worker runs the workflows,
  # and tests/e2e/run.sh checks each command's exit status and output.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      # `orcher new` makes projects in all three languages, which the run builds.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the worker's SDK
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r tests/e2e/requirements.txt
      - name: Run every command against the engine
        run: tests/e2e/run.sh target/debug/orcher "$RUNNER_TEMP/venv/bin/python"
